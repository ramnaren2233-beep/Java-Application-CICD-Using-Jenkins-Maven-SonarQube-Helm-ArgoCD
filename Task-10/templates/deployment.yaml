apiVersion: apps/v1
kind: Deployment
metadata:
  name: task10-java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task10-java-app
  template:
    metadata:
      labels:
        app: task10-java-app
    spec:
      containers:
        - name: java-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - containerPort: 8080
