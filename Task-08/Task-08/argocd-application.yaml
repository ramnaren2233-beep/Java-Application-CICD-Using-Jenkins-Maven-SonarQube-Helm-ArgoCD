yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task8-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ramnaren2233-beep/Java-Application-CICD-Using-Jenkins-Maven-SonarQube-Helm-ArgoCD.git
    targetRevision: main
    path: Task-06

  destination:
    server: https://kubernetes.default.svc
    namespace: task8-gitops

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
